[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tdgnet"
version = "0.1.0"
description = "Temporal dynamic graph network for hallucination detection in diffusion language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Arshia Hemmat" },
  { name = "Philip Torr" },
  { name = "Yongqiang Chen" },
  { name = "Junchi Yu" },
]
dependencies = ["torch>=2.4", "numpy>=1.24", "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://arshiahemmat.com/tdgnet/"
Paper = "https://arxiv.org/abs/2602.08048"

[tool.setuptools.packages.find]
where = ["."]
include = ["tdgnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

